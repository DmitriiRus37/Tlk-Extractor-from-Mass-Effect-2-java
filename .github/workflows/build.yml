name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }} (${{ matrix.distribution }} ${{ matrix.java-package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Java 21 is the oldest supported JDK; the pom picks the JavaFX version from the JDK
        # that runs Maven, see its profiles.
        include:
          - java: '21'
            distribution: temurin
            java-package: jdk
          - java: '25'
            distribution: temurin
            java-package: jdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          java-package: ${{ matrix.java-package }}
          cache: maven

      # compile (bytecode level Java 21), tests, JaCoCo coverage check, then the Javadoc
      - name: Build
        run: mvn -B -ntp clean verify javadoc:javadoc
