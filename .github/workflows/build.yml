name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }} (${{ matrix.distribution }} ${{ matrix.java-package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pom picks the JavaFX version (or none) from the JDK that runs Maven, see its profiles.
        include:
          # JDK 8 with a bundled JavaFX (jre/lib/ext/jfxrt.jar): the GUI is compiled too
          - java: '8'
            distribution: zulu
            java-package: jdk+fx
          # JDK 8 without JavaFX: the "no-javafx" profile builds the TLK classes and tests only
          - java: '8'
            distribution: temurin
            java-package: jdk
          - java: '11'
            distribution: temurin
            java-package: jdk
          - java: '17'
            distribution: temurin
            java-package: jdk
          - java: '21'
            distribution: temurin
            java-package: jdk
          - java: '25'
            distribution: temurin
            java-package: jdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          java-package: ${{ matrix.java-package }}
          cache: maven

      # compile (bytecode level Java 8), tests, JaCoCo coverage check, then the Javadoc
      - name: Build
        run: mvn -B -ntp clean verify javadoc:javadoc
